
name: Build Dream TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.5'
          channel: stable

      - name: Extract launcher source
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q FLauncher-master.zip -d extracted

          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR="${PUBSPEC%/pubspec.yaml}"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          flutter build apk --debug --verbose 2>&1 | tee "$GITHUB_WORKSPACE/build-debug.log"
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/dream-tv-debug.apk"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dream-TV-Build-Log
          path: build-debug.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dream-TV-APK
          path: dre
          am-tv-debug.apk
