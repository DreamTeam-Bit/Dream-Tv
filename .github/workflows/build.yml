
name: Build Dream TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.5'
          channel: stable
          cache: true

      - name: Extract launcher source
        shell: bash
        run: |
          set -euo pipefail

          test -f FLauncher-master.zip
          mkdir -p extracted
          unzip -q FLauncher-master.zip -d extracted

          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: Could not find pubspec.yaml"
            exit 1
          fi

          PROJECT_DIR="${PUBSPEC%/pubspec.yaml}"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Configure test signing
        shell: bash
        run: |
          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' "$APP_GRADLE"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dream-TV-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
          retention-days: 7
